[package]
name = "crossport"
version = "0.1.0"
description = "CrossPort desktop application backend"
authors = ["CrossPort Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crossport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

# Windows API surface, kept to what the platform abstraction actually needs:
# drive-letter enumeration and volume queries (Phase 2) plus the current
# process handle and its memory counters (used by the transfer suite to prove
# that copying a large file does not grow this process's memory).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
