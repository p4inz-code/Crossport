[package]
name = "crossport"
version = "0.1.0"
description = "CrossPort desktop application backend"
authors = ["CrossPort Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crossport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"

# Native drive-letter enumeration. Kept to the single API the platform
# abstraction needs; capacity and volume kinds arrive with the Phase 2 drives
# feature.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem"] }
